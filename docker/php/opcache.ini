; Performance: enable OPcache in the PHP-FPM container.
; validate_timestamps=1 keeps development safe (file changes are picked up
; within revalidate_freq seconds), while still eliminating per-request
; re-compilation of the entire framework — the dominant TTFB cost observed.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=12000
opcache.max_wasted_percentage=5
opcache.validate_timestamps=1
opcache.revalidate_freq=2
opcache.fast_shutdown=1